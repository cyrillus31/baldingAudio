<!--
  PLACEHOLDER LOGO - to be replaced before the first public release.

  Deliberately obvious that it is a placeholder: a dashed outline and the word
  PLACEHOLDER, so nobody ships it by accident. Replace this file, keep the name
  `docs/logo-placeholder.svg`, and the README picks the new one up unchanged.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200"
     role="img" aria-label="baldingAudio logo placeholder">
  <rect width="640" height="200" fill="#0d1117"/>

  <!-- The overlay's own shape, roughly: bars running inward from the side edges. -->
  <g stroke-linecap="round" fill="none">
    <path d="M 70 40 L 190 40"   stroke="#ff4b4b" stroke-width="13"/>
    <path d="M 70 62 L 150 62"   stroke="#ff4b4b" stroke-width="13" opacity="0.55"/>
    <path d="M 450 138 L 570 138" stroke="#ff4b4b" stroke-width="13" opacity="0.35"/>
    <path d="M 490 160 L 570 160" stroke="#ff4b4b" stroke-width="13" opacity="0.2"/>
  </g>

  <text x="320" y="108" text-anchor="middle" font-family="monospace" font-size="34"
        fill="#e6edf3" letter-spacing="2">baldingAudio</text>

  <rect x="8" y="8" width="624" height="184" fill="none" stroke="#f0b429"
        stroke-width="2" stroke-dasharray="9 7"/>
  <text x="320" y="182" text-anchor="middle" font-family="monospace" font-size="13"
        fill="#f0b429" letter-spacing="3">PLACEHOLDER LOGO</text>
</svg>
